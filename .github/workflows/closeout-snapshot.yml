name: Closeout snapshot and resume regression tests
on:
  push:
    branches: [docs/full-grooming-2026-09-10]
    paths: [.github/workflows/closeout-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: closeout-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned isolated test dependencies
        run: |
          python3 -m venv /tmp/closeout-tests
          /tmp/closeout-tests/bin/pip install 'pytest==9.0.2' 'PyYAML==6.0.3'
      - name: Run the preserved 75 regression checks
        run: |
          mkdir -p closeout-results
          /tmp/closeout-tests/bin/python -m pytest tests/grooming/test_resume_v4.py tests/grooming/test_resume_workflow.py -q --junitxml=closeout-results/resume-regressions.xml
      - name: Read all current issues, comments, PRs and exact public source revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/grooming/closeout_snapshot.py
      - name: Preserve the exact grooming source for local verification
        if: always()
        run: git archive --format=tar.gz HEAD -o closeout-results/grooming-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: closeout-current-evidence
          path: closeout-results/
          retention-days: 14
