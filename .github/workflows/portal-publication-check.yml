name: Verify and publish specification review portal
on:
  push:
    branches: [docs/full-grooming-2026-09-10]
    paths: [.github/workflows/portal-publication-check.yml]
permissions:
  contents: write
  pages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install isolated browser tooling
        run: |
          python3 -m pip install --user 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Exercise the actual generated reader and check publication endpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,time,urllib.request,urllib.error
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('docs/grooming/full-2026-09-10/portal-verification');root.mkdir(parents=True,exist_ok=True)
          report={'source_sha':os.environ['GITHUB_SHA'],'scope':'The generated review portal, not the product UIs described in its specs','browser':{},'endpoints':{},'authentication':'Public reader; review submission uses GitHub authentication. No server-side domain/OAuth access restriction claimed.'}
          server=subprocess.Popen(['python3','-m','http.server','8765','--bind','127.0.0.1','--directory','portal'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
              for _ in range(50):
                  try:urllib.request.urlopen('http://127.0.0.1:8765',timeout=1);break
                  except Exception:time.sleep(.1)
              with sync_playwright() as p:
                  browser=p.chromium.launch();page=browser.new_page(viewport={'width':1440,'height':1050},device_scale_factor=1)
                  errors=[];page.on('pageerror',lambda error:errors.append(str(error)))
                  page.goto('http://127.0.0.1:8765/',wait_until='networkidle')
                  page.locator('h1').filter(has_text='От запроса').wait_for()
                  page.screenshot(path=str(root/'portal-home.png'),full_page=True)
                  page.goto('http://127.0.0.1:8765/#/specs')
                  page.locator('#search').fill('Evolve');assert page.locator('#results .card').count()>=1
                  page.goto('http://127.0.0.1:8765/#/spec/00-master')
                  page.locator('article.document h1').wait_for();assert 'восстановление' in page.locator('article.document h1').inner_text()
                  page.screenshot(path=str(root/'portal-master.png'),full_page=False)
                  page.goto('http://127.0.0.1:8765/#/backlog')
                  page.locator('#repo').select_option('task-cli');page.locator('#search').fill('task-cli#169')
                  assert page.locator('#results .row').count()==1
                  page.screenshot(path=str(root/'portal-task-search.png'),full_page=False)
                  data=page.evaluate("JSON.parse(document.getElementById('data').textContent)")
                  for d in data['documents']:
                      page.goto('http://127.0.0.1:8765/#/spec/'+urllib.parse.quote(d['id'],safe=''))
                      assert page.locator('article.document').count()==1, d['id']
                      assert page.locator('article.document script').count()==0, d['id']
                  page.set_viewport_size({'width':393,'height':852});page.goto('http://127.0.0.1:8765/')
                  page.locator('#menu').click();assert page.locator('aside').is_visible()
                  page.locator('aside a[href="#/specs"]').click();page.locator('#search').wait_for()
                  page.screenshot(path=str(root/'portal-mobile.png'),full_page=False)
                  report['browser']={'documents_rendered':len(data['documents']),'public_issues':len(data['issues']),'quote_records':len(data['quotes']),'desktop':'1440x1050','mobile':'393x852','javascript_errors':errors,'search_and_navigation':True}
                  assert not errors,errors
                  browser.close()
          finally:
              server.terminate();server.wait(timeout=10)
          def probe(url):
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Rig-authorized-spec-publication'})
                  with urllib.request.urlopen(request,timeout=45) as response:
                      body=response.read(12_000_000)
                      return {'status':response.status,'url':response.url,'content_type':response.headers.get('Content-Type'),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'title':(re.findall(b'<title[^>]*>(.*?)</title>',body,re.S) or [b''])[0].decode(errors='replace')}
              except urllib.error.HTTPError as exc:return {'status':exc.code,'url':url}
              except Exception as exc:return {'url':url,'error':str(exc)}
          for url in ['https://spec-dev.hyperide.ai/','https://spec-dev.hyperide.ai/spec/','https://spec-dev.hyperide.ai/spec/2026-07-11-haft-research']:
              report['endpoints'][url]=probe(url)
          # Do not replace any existing Pages site. Record its status; a missing
          # administrative permission is a deployment gap, not a green deploy.
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:report['github_pages']={'existing_site':json.load(response),'action':'left unchanged'}
          except urllib.error.HTTPError as exc:
              report['github_pages']={'status':exc.code,'action':'No existing site was modified; enabling Pages needs the separate administration permission.'}
          url='https://rawcdn.githack.com/alex-mextner/rig-cli/'+os.environ['GITHUB_SHA']+'/portal/index.html'
          publication=probe(url);publication['kind']='Immutable static publication from committed GitHub HTML; not Vercel deployment'
          publication['local_sha256']=hashlib.sha256(pathlib.Path('portal/index.html').read_bytes()).hexdigest()
          publication['verified_same_content']=publication.get('sha256')==publication['local_sha256']
          report['publication']=publication
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert publication.get('status')==200 and publication['verified_same_content'], 'Alternative publication not verified'
          PY
      - name: Commit real portal screenshots and endpoint evidence
        if: always()
        run: |
          git config user.name 'Rig grooming audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/grooming/full-2026-09-10/portal-verification/
          if ! git diff --cached --quiet; then
            git commit -m 'docs(review): preserve actual browser screenshots and publication checks'
            git pull --rebase origin docs/full-grooming-2026-09-10
            git push origin HEAD:docs/full-grooming-2026-09-10
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portal-browser-verification
          path: docs/grooming/full-2026-09-10/portal-verification/
          retention-days: 30
