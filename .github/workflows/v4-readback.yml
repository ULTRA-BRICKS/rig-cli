name: V4 recovery read-back and original specification
on:
  push:
    branches: [docs/full-grooming-2026-09-10]
    paths: [.github/workflows/v4-readback.yml]
permissions:
  contents: write
  issues: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true}
      - name: Read current provider state and public source document
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import concurrent.futures,datetime,hashlib,json,os,pathlib,urllib.request,urllib.error,urllib.parse
          root=pathlib.Path('docs/grooming/v4-2026-09-10');root.mkdir(parents=True,exist_ok=True)
          repos=['rig-cli','agent-tools','review-cli','task-cli','tg-cli','qa-cli','draw-cli','stt-cli','research-cli','dev-cli','pm-cli']
          def read(url,auth=False):
              headers={'User-Agent':'rig-v4-authorized-audit','Accept':'application/vnd.github+json'}
              if auth:headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:return response.read()
          def one(repo):
              result={'repo':repo}
              try:
                  url='https://raw.githubusercontent.com/alex-mextner/'+repo+'/docs/full-grooming-2026-09-10/docs/grooming/full-2026-09-10/applied.json'
                  journal=json.loads(read(url));(root/(repo+'-previous-applied.json')).write_text(json.dumps(journal,ensure_ascii=False,indent=2))
                  result.update({k:journal.get(k) for k in ('root','counts','processed_bodies','planned_issues','native_parents_verified','finished_at')})
                  result['unresolved']=[e for e in journal['events'] if any(x in e['result'] for x in ('error','skipped','blocked','gap','blocker'))]
              except Exception as exc:result['journal_error']=str(exc)
              rows=[];page=1
              while True:
                  part=json.loads(read('https://api.github.com/repos/alex-mextner/'+repo+'/issues?state=all&sort=created&direction=asc&per_page=100&page='+str(page),True));rows.extend(r for r in part if 'pull_request' not in r)
                  if len(part)<100:break
                  page+=1
              # Public repositories only, read comments in subsequent targeted passes.
              compact=[{k:r.get(k) for k in ('id','number','node_id','title','body','state','state_reason','updated_at','html_url','labels','comments','sub_issues_summary','issue_dependencies_summary')} for r in rows]
              (root/(repo+'-current-issues.json')).write_text(json.dumps(compact,ensure_ascii=False,indent=2))
              result['current_issues']=len(rows);result['groomed_marker_count']=sum('<!-- rig-grooming:2026-09-10:v1 -->' in (r.get('body') or '') for r in rows)
              result['recovery_parents']=sum('<!-- rig-grooming-parent:' in (r.get('body') or '') for r in rows)
              return result
          results=list(concurrent.futures.ThreadPoolExecutor(max_workers=3).map(one,repos))
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'repositories':results,'mutations':0,'previous_groomed_marker_total':sum(r['groomed_marker_count'] for r in results)}
          url='https://spec-dev.hyperide.ai/spec/2026-07-01-agent-ecosystem-retrospective/api/spec'
          try:
              raw=read(url);obj=json.loads(raw)
              # Read only the explicitly requested public spec; no drafts/credentials/health data.
              safe={k:obj[k] for k in ('title','html','headings','mtime') if k in obj}
              (root/'original-retrospective-rendered.json').write_text(json.dumps(safe,ensure_ascii=False,indent=2))
              report['original_spec']={'url':url,'title':obj.get('title'),'sha256':hashlib.sha256(raw).hexdigest(),'html_bytes':len(obj.get('html','').encode()),'headings':len(obj.get('headings',[]))}
          except Exception as exc:report['original_spec']={'url':url,'error':str(exc)}
          (root/'readback-summary.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n');print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit source and read-back evidence without mutating issues
        run: |
          git config user.name 'Rig grooming audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/grooming/v4-2026-09-10/
          git diff --cached --quiet && exit 0
          git commit -m 'docs(audit): record actual prior issue changes and requested source spec'
          git pull --rebase origin docs/full-grooming-2026-09-10
          git push origin HEAD:docs/full-grooming-2026-09-10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v4-current-state
          path: docs/grooming/v4-2026-09-10/
          retention-days: 30
